/* データ取得 */

async function load(){
  if(!user)return;

  const names=[
    "machines",
    "store_groups",
    "stores",
    "sessions"
  ];

  const results=await Promise.all(

/* 数学モデル */

function specs(m){
  const p=Number(m?.jackpot_denominator);
  const ty=Number(m?.average_ty_balls);

  if(!(p>0&&ty>0))return null;

  return {p,ty};
}

/*
  基本差玉期待値：
  E[純増玉] = N/P × TY − B

  N: 通常回転数
  P: 初当たり確率分母
  TY: 初当たり1回あたり純増差玉
  B: 通常回転に使った玉数

  期待値は、固定したNとBに対する
  条件付き理論指標。
*/
function expectedBalls(m,spins,ballsIn){
  const sp=specs(m);

  if(!sp||!(spins>0&&ballsIn>0))return null;

  const expectedPayout=spins/sp.p*sp.ty;
  const netBalls=expectedPayout-ballsIn;

  return {
    expectedPayout,
    netBalls,
    rotation:250*spins/ballsIn,
    border:250*sp.p/sp.ty
  };
}

/*
  投資内訳反映型の条件付き期待値。

  現金借玉にかかったコストは
  現金投資額として評価。

  再プレイ・持ち玉消費は
  交換単価で評価。

  ただし、これは固定された消費玉数と
  投資配分に対する条件付き評価であり、
  初当たり時刻や持ち玉発生過程を
  確率的にモデル化したものではない。
*/
function postEVWithFunding(params){
  const {
    m,spins,ballsIn,
    cash,cashBalls,
    replay,held,
    fee,exchange
  }=params;

  const base=expectedBalls(m,spins,ballsIn);

  if(!base||!(exchange>0))return null;

  const totalFunding=
    cashBalls+replay+held;

  if(totalFunding!==ballsIn){
    return null;
  }

  const expectedPayoutYen=
    base.expectedPayout*exchange;

  const fundingCost=
    cash+
    (replay+held+fee)*exchange;

  const ev=expectedPayoutYen-fundingCost;

  return {
    ...base,
    ev,
    fundingCost,
    expectedPayoutYen,
    totalFunding
  };
}

/*
  時間モデル：
  H = N / 通常回転速度
      + (N/P) × 平均初当たり消化時間
*/
function plannedSpins(hours,speed,hitMinutes,p){
  if(
    !(hours>0&&speed>0&&hitMinutes>=0&&p>0)
  )return null;

  return hours/(
    1/speed+
    hitMinutes/(60*p)
  );
}

/*
  稼働前：投資条件を固定した
  必要回転率の簡易モデル。

  現金玉：貸玉単価
  貯玉玉：交換単価
  再プレイ手数料：交換単価

  初当たり後の持ち玉再投資は
  確率過程として含まない。
*/
function preEV(rotation,params){
  const {
    n,p,ty,q,lend,
    mode,available,fee,limit
  }=params;

  if(!(rotation>0&&n>0))return null;

  const consumption=250*n/rotation;

  const cap=mode==="cash"
    ?0
    :Math.min(
      Math.max(0,available),
      limit==null
        ?Infinity
        :Math.max(0,limit)
    );

  if(mode==="replay"&&consumption>cap){
    return null;
  }

  const replay=Math.min(consumption,cap);
  const cashBalls=consumption-replay;

  const feeCost=replay>0?fee*q:0;

  const payout=n/p*ty*q;

  const cost=
    cashBalls*lend+
    replay*q+
    feeCost;

  return {
    ev:payout-cost,
    payout,
    cost,
    replay,
    cashBalls,
    consumption
  };
}

function requiredRotation(target,params){
  const maxPayout=params.n/params.p*
    params.ty*params.q;

  if(target>=maxPayout)return null;

  let low=0.000001;
  let high=1;

  for(let i=0;i<100;i++){
    const x=preEV(high,params);
    if(x&&x.ev>=target)break;
    high*=2;
  }

  const highResult=preEV(high,params);

  if(!highResult||highResult.ev<target){
    return null;
  }

  for(let i=0;i<90;i++){
    const mid=(low+high)/2;
    const x=preEV(mid,params);

    if(x&&x.ev>=target){
      high=mid;
    }else{
      low=mid;
    }
  }

  return high;
}

      .delete()

      .select("id");

    check(result);

    if(result.data.length!==1){

    await load();

$("saveStore").onclick=async()=>{
  if(storeBusy)return;

  storeBusy=true;

  const btn=$("saveStore");
  btn.disabled=true;
  btn.textContent="保存中…";

  try{
    if(!user)throw Error("ログインしてください");

    const name=val("storeName");

    if(!name){
      throw Error("店舗名を入力してください");
    }

    if(!rateRows.length){
      throw Error("貸玉レートを追加してください");
    }

    const seen=new Set();

    for(const r of rateRows){
      const rate=Number(r.rate);
      const ex=Number(r.exchange);

      if(!(rate>0&&ex>0)){
        throw Error(
          "貸玉単価と交換玉数を入力してください"
        );
      }

      if(seen.has(rate)){
        throw Error(
          "同じ貸玉レートが重複しています"
        );
      }

      seen.add(rate);

      for(const key of [
        "fee","opening",
        ...(r.limit===""?[]:["limit"])
      ]){
        const x=Number(r[key]);

        if(!Number.isSafeInteger(x)||x<0){
          throw Error(
            "玉数は0以上の整数で入力してください"
          );
        }
      }
    }

    let gid=editingGroup;

    if(!gid){
      setStatus(
        "storeStatus",
        "店舗を登録しています…"
      );

      const result=await db.from("store_groups")
        .insert({
          user_id:user.id,
          name
        })
        .select("id")
        .single();

      gid=check(result).id;
      editingGroup=gid;
    }else{
      check(await db.from("store_groups")
        .update({name})
        .eq("id",gid)
        .eq("user_id",user.id));
    }

    for(let i=0;i<rateRows.length;i++){
      const r=rateRows[i];

      setStatus(
        "storeStatus",
        `貸玉設定 ${i+1}/${rateRows.length} を保存中…`
      );

      const payload={
        name,
        store_group_id:gid,
        play_rate_yen:Number(r.rate),
        purchase_rate:Number(r.rate),
        analysis_category:r.category,
        exchange_rate:100/Number(r.exchange),
        replay_limit_balls:r.limit===""
          ?null
          :Number(r.limit),
        replay_fee_balls:Number(r.fee),
        opening_balls:Number(r.opening)
      };

      const result=r.id
        ?await db.from("stores")
          .update(payload)
          .eq("id",r.id)
          .eq("user_id",user.id)
        :await db.from("stores")
          .insert({
            ...payload,
            user_id:user.id
          })
          .select("id")
          .single();

      if(result.error){
        throw Error(
          `貸玉設定${i+1}：${result.error.message}`
        );
      }

      if(!r.id)r.id=result.data.id;
    }

    await load();
    resetStore();

    setStatus(
      "storeStatus",
      "店舗を保存しました",
      "success"
    );
  }catch(e){
    showError("storeStatus",e);
  }finally{
    storeBusy=false;
    btn.disabled=false;
    btn.textContent="店舗を保存";
  }
};

$("calculateBefore").onclick=()=>{
  const out=$("beforeResult");

  try{
    const m=machine(val("beforeMachine"));
    const st=store(val("beforeRate"));
    const sp=specs(m);

    if(!sp||!st){
      throw Error("機種と店舗を選択してください");
    }

    const hours=num("beforeHours");
    const speed=num("beforeSpeed");
    const hitMin=num("beforeHitMinutes");
    const target=num("beforeTarget");

    if(
      val("beforeSpeed")===""||
      val("beforeHitMinutes")===""||
      !(hours>0&&speed>0&&hitMin>=0)||
      !Number.isFinite(target)
    ){
      throw Error(
        "時間・通常回転速度・大当たり消化時間を入力してください"
      );
    }

    const n=plannedSpins(
      hours,speed,hitMin,sp.p
    );

    const mode=val("beforeFunding");

    const available=mode==="cash"
      ?0
      :num("beforeReplayAvailable");

    if(
      mode!=="cash"&&
      (
        val("beforeReplayAvailable")===""||
        !Number.isSafeInteger(available)||
        available<0
      )
    ){
      throw Error(
        "使用可能な貯玉を入力してください"
      );
    }

    const q=Number(st.exchange_rate);
    const lend=Number(st.play_rate_yen);
    const fee=Number(st.replay_fee_balls||0);
    const limit=st.replay_limit_balls==null
      ?null
      :Number(st.replay_limit_balls);

    if(!(q>0&&lend>0)){
      throw Error("店舗の交換条件が不正です");
    }

    const params={
      n,p:sp.p,ty:sp.ty,
      q,lend,mode,
      available,fee,limit
    };

    const targets=[
      ...new Set([
        0,3000,5000,10000,20000,target
      ])
    ].sort((a,b)=>a-b);

    const rows=targets.map(t=>{
      const r=requiredRotation(t,params);

      return `
        <tr>
          <td>${yen(t)}</td>
          <td>
            ${r===null
              ?"算出不可"
              :r.toFixed(2)+"回"}
          </td>
        </tr>
      `;
    }).join("");

    const selected=requiredRotation(target,params);
    const equalBorder=250*sp.p/sp.ty;

    out.innerHTML=`
      <div class="card">
        <h3>必要回転率</h3>
        <div class="number">
          ${selected===null
            ?"算出不可"
            :selected.toFixed(2)+"回/250玉"}
        </div>
        <p class="muted">
          等価ボーダー：
          ${equalBorder.toFixed(2)}回/250玉<br>
          想定通常回転数：
          ${n.toFixed(1)}回<br>
          期待初当たり：
          ${(n/sp.p).toFixed(2)}回
        </p>
        <table>
          <thead>
            <tr>
              <th>目標期待値</th>
              <th>必要回転率</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="notice">
          必要回転率は現金・再プレイの
          単価差を考慮した簡易モデルです。
          初当たり後の持ち玉移行や
          投資額の確率分布は未反映です。
          等価ボーダーとは計算条件が異なります。
        </div>
      </div>
    `;
  }catch(e){
    out.innerHTML=`
      <p class="status error">
        ${safe(e.message)}
      </p>
    `;
  }
};

  if(mode==="none"){
    out.textContent=
      "期待値は未登録として保存します。";
    return;
  }

  if(mode==="manual"){
    out.textContent=
      "別途算出した期待値と計算根拠を保存します。";
    return;
  }

  const m=machine(val("sessionMachine"));
  const st=store(val("sessionRate"));

  const result=postEVWithFunding({
    m,
    spins:num("spins"),
    ballsIn:num("ballsIn"),
    cash:num("cash"),
    cashBalls:num("cashBalls"),
    replay:num("replay"),
    held:num("heldBalls"),
    fee:num("replayFee"),
    exchange:Number(st?.exchange_rate)
  });

  if(!result){
    out.textContent=
      "期待値計算には通常回転数・通常回転消費玉数・一致する投資内訳が必要です。";
    return;

  out.textContent=

    `実測回転率：${result.rotation.toFixed(2)}回/250玉\n`+
    `投資評価額：${yen(result.fundingCost)}\n`+
    `期待獲得価値：${yen(result.expectedPayoutYen)}`;

async function deleteSession(id){
  const s=session(id);
  if(!s)return;

  const name=machine(s.machine_id)?.name||"機種不明";

  if(!confirm(
    `${s.played_on}の「${name}」を削除しますか？\n収支・期待値・欠損余剰も再集計されます。`
  ))return;

  try{
    const result=await db.from("sessions")
      .delete()
      .eq("id",id)
      .eq("user_id",user.id)
      .select("id");

    check(result);

    if(result.data.length!==1){
      throw Error("削除対象を確認できませんでした");
    }

    if(editingSession===id)resetSession();

    await load();

    setStatus(
      "globalStatus",
      "稼働実績を削除しました",
      "success"
    );

    show("home");
  }catch(e){
    showError("globalStatus",e);
  }
}

$("cancelSession").onclick=resetSession;

$("saveSession").onclick=async()=>{
  if(sessionBusy)return;

  sessionBusy=true;

  const btn=$("saveSession");
  btn.disabled=true;
  btn.textContent="保存中…";

  try{
    if(!user)throw Error("ログインしてください");

    const st=store(val("sessionRate"));
    const m=machine(val("sessionMachine"));

    if(!st||!m){
      throw Error(
        "店舗・貸玉レート・機種を選択してください"
      );
    }

    if(!val("playedOn")){
      throw Error("稼働日を入力してください");
    }

    const cash=nonnegativeNumber("cash");
    const cashBalls=nonnegativeInteger("cashBalls");
    const replay=nonnegativeInteger("replay");
    const fee=nonnegativeInteger("replayFee");
    const held=nonnegativeInteger("heldBalls");
    const deposit=nonnegativeInteger("deposit");
    const ballsOut=nonnegativeInteger("ballsOut");
    const returned=nonnegativeNumber("returned");
    const ballsIn=nonnegativeInteger("ballsIn");
    const spins=nonnegativeInteger("spins");

    if(deposit>ballsOut){
      throw Error(
        "貯玉数が総獲得玉数を超えています"
      );
    }

    const totalFunding=
      cashBalls+replay+held;

    if(totalFunding!==ballsIn){
      throw Error(
        "現金借玉・再プレイ・持ち玉の合計を、通常回転消費玉数と一致させてください"
      );
    }

    const lend=Number(st.play_rate_yen);
    const exchange=Number(st.exchange_rate);

    if(!(lend>0&&exchange>0)){
      throw Error("店舗の貸玉・交換条件が不正です");
    }

    if(cash>0&&cashBalls===0){
      throw Error(
        "現金投資がある場合は現金で借りた玉数を入力してください"
      );
    }

    if(cash===0&&cashBalls>0){
      throw Error(
        "現金で借りた玉数がある場合は現金投資額を入力してください"
      );
    }

    const manualProfit=
      val("manualProfit")!=="";

    if(
      manualProfit&&
      !Number.isFinite(num("manualProfit"))
    ){
      throw Error("実収支の入力値が不正です");
    }

    const change=
      deposit-replay-fee;

    const actual=manualProfit
      ?num("manualProfit")
      :returned-cash+change*exchange;

    const evMode=val("evMode");

    let ev=null;
    let evInfo=null;
    let evBasis="";

    if(evMode==="model"){
      evInfo=postEVWithFunding({
        m,
        spins,
        ballsIn,
        cash,
        cashBalls,
        replay,
        held,
        fee,
        exchange
      });

      if(!evInfo){
        throw Error(
          "期待値を計算できません。通常回転数・消費玉数・投資内訳を確認してください。"
        );
      }

      ev=evInfo.ev;
    }else if(evMode==="manual"){
      if(
        val("manualEv")===""||
        !Number.isFinite(num("manualEv"))
      ){
        throw Error(
          "手動期待値を入力してください"
        );
      }

      if(!val("evBasis")){
        throw Error(
          "期待値の計算根拠を入力してください"
        );
      }

      ev=num("manualEv");
      evBasis=val("evBasis");
    }

    const previous=editingSession
      ?session(editingSession)
      :null;

    const oldDetails=previous?.details||{};

    const details={
      ...oldDetails,

      store_id:st.id,
      store_group_id:st.store_group_id,
      play_rate_yen:lend,
      analysis_category:category(st),
      exchange_rate_yen_per_ball:exchange,

      saved_balls_invested:replay,
      replay_fee_balls:fee,
      deposited_balls:deposit,
      cash_returned_yen:returned,

      cash_purchased_balls:cashBalls,
      held_balls_used:held,
      investment_breakdown_version:"v2",

      actual_profit_yen:actual,
      profit_manually_entered:manualProfit,

      post_ev_mode:evMode,
      post_ev_yen:ev,
      post_ev_basis:evBasis,
      post_ev_model_version:
        "funding-conditional-v2",
      post_ev_rotation:
        evInfo?.rotation??null,
      post_ev_expected_payout_yen:
        evInfo?.expectedPayoutYen??null,
      post_ev_funding_cost_yen:
        evInfo?.fundingCost??null,

      balance_version:"v1"
    };

    const payload={
      machine_id:m.id,
      played_on:val("playedOn"),
      store_name:
        group(st.store_group_id)?.name||st.name,
      cash_investment_yen:cash,
      balls_in:ballsIn,
      balls_out:ballsOut,
      normal_spins:spins,
      notes:val("notes"),
      details
    };

    if(editingSession){
      const result=await db.from("sessions")
        .update(payload)
        .eq("id",editingSession)
        .eq("user_id",user.id)
        .select("id");

      check(result);

      if(result.data.length!==1){
        throw Error(
          "稼働実績の更新対象が見つかりません"
        );
      }
    }else{
      check(await db.from("sessions").insert({
        ...payload,
        user_id:user.id
      }));
    }

    await load();
    resetSession();

    setStatus(
      "globalStatus",
      "稼働実績を保存しました",
      "success"
    );

    show("home");
  }catch(e){
    showError("sessionStatus",e);
  }finally{
    sessionBusy=false;
    btn.disabled=false;
    btn.textContent="稼働を保存";
  }
};

/* 集計 */

function filtered(cat,rate="all",funding="all"){
  return sessions.filter(s=>
    (cat==="all"||pCategory(s)===cat)&&
    (rate==="all"||String(pRate(s))===rate)&&
    (funding==="all"||fundingType(s)===funding)
  );
}

function summarize(list){
  const profits=list
    .map(pProfit)
    .filter(x=>x!==null);

  const evs=list
    .map(pEV)
    .filter(x=>x!==null);

  const pairs=list.filter(
    s=>pSurplus(s)!==null
  );

  return {
    totalProfit:profits.reduce((a,b)=>a+b,0),
    totalEV:evs.reduce((a,b)=>a+b,0),
    totalSurplus:pairs.reduce(
      (a,s)=>a+pSurplus(s),0
    ),
    profitCount:profits.length,
    evCount:evs.length,
    pairCount:pairs.length,
    count:list.length
  };
}

function metric(title,value,foot=""){
  return `
    <div class="metric">
      <small>${safe(title)}</small>
      <strong>${value}</strong>
      <div class="muted">${safe(foot)}</div>
    </div>
  `;
}

function summaryHTML(list){
  const x=summarize(list);

  return `
    <div class="grid">
      ${metric(
        "累計実収支",
        yen(x.totalProfit),
        `${x.profitCount}件`
      )}
      ${metric(
        "累計期待値",
        yen(x.totalEV),
        `${x.evCount}件`
      )}
      ${metric(
        "累計欠損・余剰",
        x.pairCount
          ?yen(x.totalSurplus)
          :"—",
        `${x.pairCount}件`
      )}
      ${metric(
        "稼働件数",
        String(x.count),
        `期待値未登録 ${x.count-x.evCount}件`
      )}
    </div>
    <p class="muted">
      欠損・余剰は実収支と期待値の
      両方が登録された稼働のみを集計。
      未登録を0円として扱いません。
    </p>
  `;
}

function renderHome(){
  const list=filtered(val("homeCategory"));

  $("homeSummary").innerHTML=
    summaryHTML(list);

  $("history").innerHTML=list.map(s=>`
    <div class="item">
      <b>
        ${safe(s.played_on)}
        ${safe(machine(s.machine_id)?.name||"機種不明")}
      </b>
      <p class="muted">
        ${safe(s.store_name||"")}／
        ${pRate(s)||"未分類"}円<br>
        投資方法：${fundingLabel(s)}<br>
        実収支：${yen(pProfit(s))}<br>
        稼働後期待値：${yen(pEV(s))}<br>
        欠損・余剰：${yen(pSurplus(s))}
      </p>
      <div class="actions">
        <button class="secondary"
          data-edit-session="${safe(s.id)}">
          編集
        </button>
        <button class="danger"
          data-delete-session="${safe(s.id)}">
          削除
        </button>

    </div>
  `).join("")||"稼働記録がありません";

$("history").addEventListener("click",e=>{
  const edit=e.target.closest("[data-edit-session]");
  const del=e.target.closest("[data-delete-session]");

  if(edit)editSession(edit.dataset.editSession);
  if(del)deleteSession(del.dataset.deleteSession);
});

function grouped(list,key){
  const map=new Map();

  for(const s of list){
    const k=String(key(s)||"未設定");

    if(!map.has(k))map.set(k,[]);
    map.get(k).push(s);
  }

  return [...map].map(([name,items])=>{
    const x=summarize(items);

    return `
      <div class="item">
        <b>${safe(name)}</b>
        <p class="muted">
          実収支：${yen(x.totalProfit)}<br>
          期待値：${yen(x.totalEV)}<br>
          欠損・余剰：
          ${x.pairCount?yen(x.totalSurplus):"—"}<br>
          対象：${x.pairCount}/${x.count}件
        </p>
      </div>
    `;
  }).join("")||"データがありません";
}

function renderCurve(list){
  const ordered=[...list].sort((a,b)=>
    String(a.played_on).localeCompare(
      String(b.played_on)
    )
  );

  let running=0;
  const points=[];

  for(const s of ordered){
    const v=pSurplus(s);

    if(v===null)continue;

    running+=v;

    points.push({
      date:s.played_on,
      value:running
    });
  }

  if(!points.length){
    $("statsCurve").innerHTML=
      '<p class="muted">集計できる稼働がありません。</p>';
    return;
  }

  const values=points.map(p=>p.value);
  const minimum=Math.min(0,...values);
  const maximum=Math.max(0,...values);
  const span=Math.max(1,maximum-minimum);

  const width=600;
  const height=200;
  const pad=28;

  const x=i=>
    pad+(width-2*pad)*
    (points.length===1
      ?0.5
      :i/(points.length-1));

  const y=v=>
    height-pad-
    (v-minimum)/span*(height-2*pad);

  const path=points.map((p,i)=>
    `${i===0?"M":"L"} ${x(i)} ${y(p.value)}`
  ).join(" ");

  $("statsCurve").innerHTML=`
    <svg class="chart"
      viewBox="0 0 ${width} ${height}">
      <line
        x1="${pad}" y1="${y(0)}"
        x2="${width-pad}" y2="${y(0)}"
        stroke="#8290a3"
        stroke-dasharray="5 5"/>
      <path d="${path}"
        fill="none"
        stroke="#7bb2ff"
        stroke-width="3"/>
      ${points.map((p,i)=>`
        <circle
          cx="${x(i)}"
          cy="${y(p.value)}"
          r="3"
          fill="#b3d2ff"/>
      `).join("")}
    </svg>
    <p class="muted">
      開始：${safe(points[0].date)}<br>
      最終：${safe(points.at(-1).date)}<br>
      累積：${yen(running)}<br>
      対象：${points.length}件
    </p>
  `;
}

function renderStats(){
  const list=filtered(
    val("statsCategory"),
    val("statsRate"),
    val("statsFunding")
  );

  $("statsSummary").innerHTML=
    summaryHTML(list);

  renderCurve(list);

  $("statsMonths").innerHTML=grouped(
    list,
    s=>String(s.played_on||"").slice(0,7)
  );

  $("statsStores").innerHTML=grouped(
    list,
    s=>s.store_name||"不明"
  );

  $("statsMachines").innerHTML=grouped(
    list,
    s=>machine(s.machine_id)?.name||"機種不明"
  );

  $("statsFundingGroups").innerHTML=grouped(
    list,
    fundingLabel
  );
}

$("homeCategory").onchange=renderHome;
$("statsCategory").onchange=renderStats;
$("statsRate").onchange=renderStats;
$("statsFunding").onchange=renderStats;

function render(){
  renderStores();
  renderMachines();
  renderSelectors();
  renderHome();

  const rates=[
    ...new Set(
      stores.map(s=>Number(s.play_rate_yen))
        .filter(x=>x>0)
    )
  ].sort((a,b)=>b-a);

  const old=val("statsRate");

  $("statsRate").innerHTML=
    '<option value="all">すべて</option>'+
    rates.map(r=>`
      <option value="${r}">
        ${r}円
      </option>
    `).join("");

  if(rates.some(r=>String(r)===old)){
    $("statsRate").value=old;
  }

  renderStats();
}

/* 認証 */

async function start(){
  try{
    const {data,error}=await db.auth.getUser();

    if(error)throw error;

    user=data.user;

    $("auth").classList.toggle("hidden",!!user);
    $("app").classList.toggle("hidden",!user);

    if(user){
      $("account").textContent=user.email||"";
      await load();
    }else{
      groups=[];
      stores=[];
      machines=[];
      sessions=[];
    }
  }catch(e){
    showError("globalStatus",e);
  }
}

$("login").onclick=async()=>{
  try{
    check(await db.auth.signInWithPassword({
      email:val("email"),
      password:val("password")
    }));

    await start();
  }catch(e){
    showError("globalStatus",e);
  }
};

$("signup").onclick=async()=>{

    check(await db.auth.signUp({
      email:val("email"),
      password:val("password")
    }));

    setStatus(
      "globalStatus",
      "登録メールを確認してください",
      "success"
    );
  }catch(e){
    showError("globalStatus",e);
  }
};

$("logout").onclick=async()=>{
  try{
    check(await db.auth.signOut());
    await start();
  }catch(e){
    showError("globalStatus",e);
  }
};

/* バックアップ */

$("backup").onclick=()=>{
  const blob=new Blob([
    JSON.stringify({
      machines,
      groups,
      stores,
      sessions
    },null,2)
  ],{
    type:"application/json"
  });

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download="pachinko-backup.json";
  a.click();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );
};
